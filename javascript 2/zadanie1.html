<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Квадраты числа</title>
</head>
<body>
    <script>
        let N = prompt("Введите число N");
        for (var i = 0; i<=N; i++){
            if (i*i <= N && i != 1 && i!= 0){
                window.alert(i*i)
            }
        }
    </script>
    
</body>
</html>
